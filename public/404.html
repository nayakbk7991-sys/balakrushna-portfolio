<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      const pathSegmentsToKeep = 1;

      const l = window.location;
      const repoPath = l.pathname
        .split("/")
        .slice(1, 1 + pathSegmentsToKeep)
        .join("/");

      const remainingPath = l.pathname
        .split("/")
        .slice(1 + pathSegmentsToKeep)
        .join("/");

      const redirect =
        l.protocol +
        "//" +
        l.host +
        "/" +
        repoPath +
        "/?/" +
        remainingPath +
        l.search +
        l.hash;

      window.location.replace(redirect);
    </script>
    <title>JobSeek</title>
  </head>
  <body>
    Redirecting...
  </body>
</html>
